services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metasuite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: metasuite
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metasuite -d metasuite"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - default
      - proxy   # red compartida con nginx externo

# ponytail: caddy removido — el nginx externo (Nginx Proxy Manager u otro)
# hace el reverse proxy y SSL. Si querés volver a Caddy, mirá git history.

volumes:
  pgdata:

networks:
  default:
  proxy:
    external: true
    # Nombre de la network donde corre tu nginx. Con NPM es típicamente
    # 'nginx-proxy_default' o el nombre que le hayas puesto al stack.
    # Ver: `docker network ls` en el VPS y ajustar acá.
    name: ${PROXY_NETWORK:-nginx-proxy_default}
